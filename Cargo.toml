[package]
name = "conf-diff"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0"
const_format = "0"
dotenvy = "0"
handlebars = { version = "5", features = ["rust-embed"] }
oracle = "0"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0"
tower-http = { version = "0", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
